# IT Help Desk - production stack (ithelpdesk.dawidolko.pl).
#
# Differs from `docker-compose.yml` in four ways:
#
#  1. Only the frontend is published, and only on loopback and the Docker
#     bridge. The backend and the database stay inside the network - from the
#     internet they can only be reached through /api on the frontend.
#  2. The frontend is built with a RELATIVE API address (`/api`), so the browser
#     hits the same domain. Otherwise the built bundle would contain
#     `http://localhost:5001` and the app would only work on the author's
#     machine.
#  3. The database has reduced memory usage - the server shares 3.7 GB of RAM
#     among all applications.
#  4. Secrets come from `.env`, not from default values in the file.
name: ithelpdesk-project

services:
  mysql:
    image: mysql:8.0
    container_name: ithelpdesk-mysql
    restart: unless-stopped
    command: >-
      --innodb-buffer-pool-size=64M
      --performance-schema=OFF
      --max-connections=50
      --innodb-log-buffer-size=8M
      --key-buffer-size=8M
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .tools/docker/.env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-helpdesk_db}
      MYSQL_USER: ${MYSQL_USER:-helpdesk_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .tools/docker/.env}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - ithelpdesk-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 320M

  backend:
    build:
      context: ../../
      dockerfile: .tools/docker/Dockerfile.backend
    container_name: ithelpdesk-backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5000
      # The server has two cores - without this, .NET reserves heaps for more
      # parallelism than this machine can offer.
      DOTNET_gcServer: "0"
      DOTNET_GCHeapCount: "1"
      ConnectionStrings__DefaultConnection: Server=mysql;Database=${MYSQL_DATABASE:-helpdesk_db};User=${MYSQL_USER:-helpdesk_user};Password=${MYSQL_PASSWORD};Port=3306;
      Jwt__Key: ${JWT_KEY:?set JWT_KEY in .tools/docker/.env}
      Jwt__Issuer: ${JWT_ISSUER:-ITHelpDeskAPI}
      Jwt__Audience: ${JWT_AUDIENCE:-ITHelpDeskClient}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - ithelpdesk-network
    deploy:
      resources:
        limits:
          memory: 384M

  frontend:
    build:
      context: ../../
      dockerfile: .tools/docker/Dockerfile.frontend
      args:
        # Relative address - the frontend and the API sit on the same domain.
        VITE_API_URL: /api
    container_name: ithelpdesk-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8130}:80"
      - "172.17.0.1:${FRONTEND_PORT:-8130}:80"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - ithelpdesk-network
    deploy:
      resources:
        limits:
          memory: 96M

networks:
  ithelpdesk-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
