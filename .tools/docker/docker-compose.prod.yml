# IT Help Desk — stack produkcyjny (ithelpdesk.dawidolko.pl).
#
# Rozni sie od `docker-compose.yml` czterema rzeczami:
#
#  1. Publikowany jest tylko front, i to wylacznie na loopback oraz bridge
#     Dockera. Backend i baza zostaja wewnatrz sieci — z internetu nie da sie
#     do nich dostac inaczej niz przez /api na froncie.
#  2. Front budowany jest z WZGLEDNYM adresem API (`/api`), wiec przegladarka
#     uderza w te sama domene. Bez tego w zbudowanym pliku wyladowalby
#     `http://localhost:5001` i aplikacja dzialalaby tylko na maszynie autora.
#  3. Baza ma przyciete zuzycie pamieci — serwer dzieli 3,7 GB RAM miedzy
#     wszystkie aplikacje.
#  4. Sekrety pochodza z `.env`, nie z wartosci domyslnych w pliku.
name: ithelpdesk-project

services:
  mysql:
    image: mysql:8.0
    container_name: ithelpdesk-mysql
    restart: unless-stopped
    command: >-
      --innodb-buffer-pool-size=64M
      --performance-schema=OFF
      --max-connections=50
      --innodb-log-buffer-size=8M
      --key-buffer-size=8M
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?ustaw MYSQL_ROOT_PASSWORD w .tools/docker/.env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-helpdesk_db}
      MYSQL_USER: ${MYSQL_USER:-helpdesk_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?ustaw MYSQL_PASSWORD w .tools/docker/.env}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - ithelpdesk-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 320M

  backend:
    build:
      context: ../../
      dockerfile: .tools/docker/Dockerfile.backend
    container_name: ithelpdesk-backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5000
      # Serwer ma dwa rdzenie — bez tego .NET rezerwuje sterty pod wieksza
      # rownoleglosc, niz ta maszyna ma do zaoferowania.
      DOTNET_gcServer: "0"
      DOTNET_GCHeapCount: "1"
      ConnectionStrings__DefaultConnection: Server=mysql;Database=${MYSQL_DATABASE:-helpdesk_db};User=${MYSQL_USER:-helpdesk_user};Password=${MYSQL_PASSWORD};Port=3306;
      Jwt__Key: ${JWT_KEY:?ustaw JWT_KEY w .tools/docker/.env}
      Jwt__Issuer: ${JWT_ISSUER:-ITHelpDeskAPI}
      Jwt__Audience: ${JWT_AUDIENCE:-ITHelpDeskClient}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - ithelpdesk-network
    deploy:
      resources:
        limits:
          memory: 384M

  frontend:
    build:
      context: ../../
      dockerfile: .tools/docker/Dockerfile.frontend
      args:
        # Wzgledny adres — front i API stoja pod ta sama domena.
        VITE_API_URL: /api
    container_name: ithelpdesk-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8130}:80"
      - "172.17.0.1:${FRONTEND_PORT:-8130}:80"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - ithelpdesk-network
    deploy:
      resources:
        limits:
          memory: 96M

networks:
  ithelpdesk-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
